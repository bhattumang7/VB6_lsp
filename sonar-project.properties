sonar.projectKey=vb6_lsp
sonar.projectName=VB6 Language Server
sonar.projectVersion=0.1.0

# ── Source layout ──────────────────────────────────────────────────────────────
# Production code: the LSP/MCP binary crate plus the analysis-engine chain.
#   src                       : vb6-lsp (LSP server + MCP)
#   crates/vb6-ast-derive/src : Children derive macro
#   crates/vb6-syntax/src     : scanner / parser / AST
#   crates/vb6-sema/src       : binder (name resolution + types)
#   crates/vb6-engine/src     : analysis Session
#   crates/vb6-formats/src    : .vbp/.vbg/.frm/.frx/.res readers and writers
#   crates/vb6-typelib/src    : type-library reader
#   crates/vb6-project/src    : project and group loading
#   crates/vb6-core/src       : compiler context and COM value layouts
#   crates/vb6-codegen/src    : p-code code generation
#   tools/oracle-diff/src     : oracle comparison tool
sonar.sources=src,crates/vb6-ast-derive/src,crates/vb6-syntax/src,crates/vb6-sema/src,crates/vb6-engine/src,crates/vb6-formats/src,crates/vb6-typelib/src,crates/vb6-project/src,crates/vb6-core/src,crates/vb6-codegen/src,tools/oracle-diff/src

# Test code (integration + per-crate tests).
sonar.tests=tests,crates/vb6-ast-derive/tests,crates/vb6-syntax/tests,crates/vb6-sema/tests,crates/vb6-engine/tests,crates/vb6-formats/tests,crates/vb6-typelib/tests,crates/vb6-project/tests,crates/vb6-codegen/tests,crates/vb6-core/tests,tools/oracle-diff/tests

# ── Exclusions ─────────────────────────────────────────────────────────────────
sonar.exclusions=target/**,**/.cargo/**

# ── Coverage ───────────────────────────────────────────────────────────────────
# The SonarQube Rust plugin reads LCOV via sonar.rust.lcov.reportPaths.
# Generated by: cargo llvm-cov ... --lcov --output-path target/coverage/lcov.info
sonar.rust.lcov.reportPaths=target/coverage/lcov.info

# ── Clippy ─────────────────────────────────────────────────────────────────────
# Pre-generated on the host by sonar-scan.ps1 (cargo is not in the scanner
# container). When this path is set the Clippy sensor reads the file instead of
# trying to invoke cargo itself.
sonar.rust.clippy.reportPaths=target/clippy-report.json

# ── Encoding ───────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Do NOT set sonar.host.url or sonar.token here ──────────────────────────────
# Pass them via -e SONAR_HOST_URL and -e SONAR_TOKEN in the scanner invocation
# (sonar-scan.ps1 does this) so credentials never live in the properties file.
