[workspace]
members = [
    "crates/vb6-syntax",
    "crates/vb6-sema",
    "crates/vb6-engine",
    "crates/vb6-core",
]
# Default set = the LSP plus its analysis-engine dependency chain, all of which
# build and test cleanly on a 64-bit host. vb6-core (the VB6 runtime emulation)
# is a member but excluded here because its runtime tests rely on 32-bit
# pointer/VARIANT layout — run them with `cargo test-i686` (or `-p vb6-core`
# under `--target i686-pc-windows-msvc`); the pure frontend/sema tests also run
# on the host via `cargo test-ast`.
default-members = [
    ".",
    "crates/vb6-syntax",
    "crates/vb6-sema",
    "crates/vb6-engine",
]
resolver = "2"

[package]
name = "vb6-lsp"
version = "0.1.0"
edition = "2021"
description = "A Language Server Protocol implementation for Visual Basic 6 with Claude AI integration"
license = "MIT"
authors = ["Umang Bhatt <bhatt.umang7@gmail.com>"]
repository = "https://github.com/bhattumang7/VB6_lsp"

[dependencies]
# LSP Server Framework
tower-lsp = "0.20"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP Client for Claude API
reqwest = { version = "0.12", features = ["json"] }

# Concurrent data structures
dashmap = "6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# VB6 analysis engine (lexer/parser/binder + Session API)
vb6-engine = { path = "crates/vb6-engine" }

# MCP server
rmcp = { version = "1", features = ["server", "transport-io"] }

# Utilities
once_cell = "1"
ropey = "1"  # Efficient text rope for document handling
walkdir = "2"  # Directory traversal for VBP discovery
uuid = "1"  # UUID parsing and validation for type library references
encoding_rs = "0.8"  # Character encoding detection and conversion (Windows-1252 support)
byteorder = "1"  # Binary reading/writing for resource files
base64 = "0.22"  # Base64 encoding for JSON resource data

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1"

[lib]
name = "vb6_lsp"
path = "src/lib.rs"

[[bin]]
name = "vb6-lsp"
path = "src/main.rs"

[[bin]]
name = "vb6-mcp"
path = "src/mcp_main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
